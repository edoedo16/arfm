<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ficus minahasae — Marker AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      background: #000;
    }

    /* Video kamera (dibuat AR.js) */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      transform: none !important;
    }

    /* Canvas Three.js (transparan di atas video) */
    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      pointer-events: none !important;
      background: transparent !important;
    }

    /* Loading */
    #scr-load {
      position: fixed; inset: 0;
      z-index: 1000;
      background: linear-gradient(160deg, #081a0c, #030d06);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      transition: opacity .5s;
    }
    #scr-load.hide { opacity: 0; pointer-events: none; }
    .sp {
      width: 40px; height: 40px;
      border: 3px solid #2e7d52;
      border-top-color: #4caf6e;
      border-radius: 50%;
      animation: sp 1s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    .l1 { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #4caf6e; }
    .l2 { font-size: 22px; font-style: italic; color: #e8f5e9; }
    .l3 { font-size: 11px; color: #6d9970; }
    .lmsg { font-size: 11px; color: #4caf6e; min-height: 16px; }

    /* HUD */
    #hud {
      position: fixed; inset: 0;
      z-index: 500;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      pointer-events: none;
    }
    #hud.show { display: flex; }

    #hud-top {
      pointer-events: auto;
      padding: 10px 14px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(78,175,110,0.22);
      border-radius: 13px;
      display: flex; align-items: center; gap: 10px;
    }
    #hud-top .title { font-size: 14px; font-style: italic; }
    #hud-top .mode { font-size: 9px; color: #4caf6e; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    #hud-top button {
      margin-left: auto;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 11px; color: #ccc;
      cursor: pointer; font-family: inherit;
    }

    #hud-hint {
      align-self: center;
      padding: 10px 18px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(78,175,110,0.2);
      border-radius: 12px;
      font-size: 12px;
      color: #a5c8ac;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }

    #hud-bot {
      align-self: center;
      pointer-events: auto;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    #hud-bot button {
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(78,175,110,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px; color: #a5c8ac;
      cursor: pointer; font-family: inherit;
    }
    #hud-bot button:active,
    #hud-bot button.on {
      background: rgba(46,125,82,0.5);
      border-color: #4caf6e;
      color: #e8f5e9;
    }

    /* Marker detection indicator */
    #detect-badge {
      align-self: center;
      padding: 6px 14px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #666;
      border-radius: 20px;
      font-size: 11px;
      color: #aaa;
      transition: all .2s;
      margin-bottom: 8px;
    }
    #detect-badge.found {
      border-color: #4caf6e;
      color: #4caf6e;
      background: rgba(46,125,82,0.25);
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 150px;
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(78,175,110,0.3);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 12px; color: #a5c8ac;
      opacity: 0; transition: opacity .25s;
      pointer-events: none; z-index: 900;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Debug panel */
    #debug {
      position: fixed;
      top: 80px; left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      border: 1px solid #4caf6e;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 10px;
      color: #4caf6e;
      max-width: 240px;
      line-height: 1.5;
      display: none;
    }
    #debug.show { display: block; }

    /* Error */
    #scr-err {
      position: fixed; inset: 0;
      z-index: 1100;
      background: linear-gradient(160deg, #1a0808, #090404);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px;
      text-align: center;
      gap: 12px;
    }
    #scr-err.show { display: flex; }
    #scr-err .ei { font-size: 44px; }
    #scr-err .et { font-size: 16px; color: #e88; }
    #scr-err .em { font-size: 12px; color: #a88; line-height: 1.65; max-width: 320px; }
    #scr-err button {
      background: #2e7d52; border: none; border-radius: 8px;
      color: #fff; padding: 10px 24px; font-size: 13px;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

  <div id="scr-load">
    <div class="l1">Botanika AR</div>
    <div class="l2">Ficus minahasae</div>
    <div class="l3">Beringin Minahasa · Ara Sulawesi</div>
    <div class="sp"></div>
    <div class="lmsg" id="lmsg">Memuat kamera AR...</div>
  </div>

  <div id="hud">
    <div id="hud-top">
      <span style="font-size:22px;">🌳</span>
      <div>
        <div class="title">Ficus minahasae</div>
        <div class="mode">Marker AR</div>
      </div>
      <button id="btn-exit">✕ Keluar</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div id="detect-badge">🔍 Mencari marker...</div>
      <div id="hud-hint">Arahkan kamera TEGAK LURUS ke marker</div>
    </div>
    <div id="hud-bot">
      <button id="c-sm">⊖ Kecil</button>
      <button id="c-rt">↺ Putar</button>
      <button id="c-fr">🌰 Berbuah</button>
      <button id="c-lg">⊕ Besar</button>
      <button id="c-dbg" style="font-size:10px;">🐞</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="debug"></div>

  <div id="scr-err">
    <div class="ei">⚠️</div>
    <div class="et" id="err-title">Terjadi Kesalahan</div>
    <div class="em" id="err-msg"></div>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>

  <script>
  (function() {
    'use strict';

    // ─────────────────────────────────────────────────────────────
    // KONFIGURASI
    // ─────────────────────────────────────────────────────────────
    const MARKER_SIZE_METERS = 0.15;   // Marker dicetak 15 cm
    const TREE_SCALE = 0.025;          // Skala pohon (~25 cm tinggi)
    // ─────────────────────────────────────────────────────────────

    const $ = id => document.getElementById(id);
    let _tt = null;

    function toast(m, d = 2200) {
      const e = $('toast');
      if (!e) return;
      e.textContent = m;
      e.classList.add('show');
      clearTimeout(_tt);
      _tt = setTimeout(() => e.classList.remove('show'), d);
    }
    function setMsg(t) { const el = $('lmsg'); if (el) el.textContent = t; }
    function hint(t) { const el = $('hud-hint'); if (el) el.textContent = t; }

    // ─── SEEDED RNG ──────────────────────────────────
    let _s = 42;
    function rng() {
      _s = (_s * 1664525 + 1013904223) & 0xffffffff;
      return (_s >>> 0) / 0xffffffff;
    }
    function h2(x, y) { return (Math.sin(x * 127.1 + y * 311.7) * 43758.5453) % 1; }
    function sn(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      return h2(ix, iy) * (1 - ux) * (1 - uy) +
        h2(ix + 1, iy) * ux * (1 - uy) +
        h2(ix, iy + 1) * (1 - ux) * uy +
        h2(ix + 1, iy + 1) * ux * uy;
    }
    function fbm(x, y, o) {
      let v = 0, a = .5, f = 1;
      for (let i = 0; i < o; i++) { v += a * sn(x * f, y * f); a *= .5; f *= 2.1; }
      return v;
    }

    // ─── TEKSTUR ─────────────────────────────────────
    function mkBark() {
      const W = 128, H = 256, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d'), img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const n = fbm(x / W * 5, y / H * 8, 5);
        const g = Math.pow(Math.abs(Math.sin(x / W * Math.PI * 16 + n * 3)), .35);
        const fi = fbm(x / W * 3 + 4, y / H * 4 + 2, 3) > .62 ? .5 : 1;
        const i4 = (y * W + x) * 4;
        img.data[i4] = Math.min(255, Math.floor((35 + n * 30 + g * 18) * fi));
        img.data[i4 + 1] = Math.min(255, Math.floor((17 + n * 14 + g * 9) * fi));
        img.data[i4 + 2] = Math.min(255, Math.floor((6 + n * 7 + g * 4) * fi));
        img.data[i4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2, 3);
      return t;
    }
    function mkGnd() {
      const W = 128, H = 128, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d'), img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const n = fbm(x / W * 6, y / H * 6, 4), i4 = (y * W + x) * 4;
        img.data[i4] = Math.floor(12 + n * 20);
        img.data[i4 + 1] = Math.floor(22 + n * 28);
        img.data[i4 + 2] = Math.floor(8 + n * 12);
        img.data[i4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(4, 4);
      return t;
    }
    function mkFig() {
      const W = 32, H = 32, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d'), img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const n = fbm(x / W * 5, y / H * 5, 3), i4 = (y * W + x) * 4;
        img.data[i4] = Math.floor(95 + n * 62);
        img.data[i4 + 1] = Math.floor(24 + n * 26);
        img.data[i4 + 2] = Math.floor(6 + n * 12);
        img.data[i4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const g = ctx.createRadialGradient(W / 2, H * .12, 0, W / 2, H * .12, W * .2);
      g.addColorStop(0, 'rgba(2,1,0,.95)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      return new THREE.CanvasTexture(c);
    }
    function mkRoot() {
      const W = 32, H = 64, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d'), img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const n = fbm(x / W * 4, y / H * 8, 3);
        const s = Math.abs(Math.sin(x / W * Math.PI * 7 + n * 2)) * .33;
        const i4 = (y * W + x) * 4;
        img.data[i4] = Math.floor(27 + n * 24 + s * 14);
        img.data[i4 + 1] = Math.floor(14 + n * 12 + s * 7);
        img.data[i4 + 2] = Math.floor(5 + n * 6 + s * 3);
        img.data[i4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(1, 5);
      return t;
    }

    // ─── BUILD TREE ──────────────────────────────────
    function buildTree(bT, gT, fT, rT) {
      const G = new THREE.Group();
      const S = 0.013;
      const bM = new THREE.MeshLambertMaterial({ map: bT });
      const stM = new THREE.MeshLambertMaterial({ color: 0x140a02 });
      const gM = new THREE.MeshLambertMaterial({ map: gT });
      const fMs = [
        new THREE.MeshLambertMaterial({ map: fT, color: 0xb83808 }),
        new THREE.MeshLambertMaterial({ map: fT, color: 0x962c06 }),
        new THREE.MeshLambertMaterial({ map: fT, color: 0xcc4210 }),
        new THREE.MeshLambertMaterial({ map: fT, color: 0x3c1e08 }),
        new THREE.MeshLambertMaterial({ map: fT, color: 0x501e06 }),
      ];
      const lMs = [];
      for (let i = 0; i < 7; i++) {
        const h = .265 + i * .013;
        lMs.push(new THREE.MeshLambertMaterial({
          color: new THREE.Color().setHSL(h, .55 + rng() * .28, .13 + rng() * .13),
          side: THREE.DoubleSide
        }));
      }
      function mkFG(r) {
        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const t = i / 10;
          const w = Math.sin(t * Math.PI) * r * (.82 + Math.sin(t * Math.PI * 1.5) * .18);
          pts.push(new THREE.Vector2(w, r * 1.5 * (t - .5)));
        }
        return new THREE.LatheGeometry(pts, 7);
      }
      const fgR = mkFG(S * 5.2), fgU = mkFG(S * 3.9);
      const stG = new THREE.CylinderGeometry(S * .5, S * .75, S * 3.5, 4);
      function addFig(P, x, y, z) {
        const ripe = rng() > .32;
        const fi = new THREE.Mesh(ripe ? fgR : fgU, fMs[Math.floor(rng() * (ripe ? 3 : 2)) + (ripe ? 0 : 3)]);
        fi.position.set(x, y, z);
        fi.rotation.set((rng() - .5) * .5, rng() * Math.PI * 2, (rng() - .5) * .5);
        const sm = new THREE.Mesh(stG, stM);
        sm.position.y = S * 5.5;
        fi.add(sm);
        P.add(fi);
      }
      function sFig(P, x, y, z, n) {
        for (let i = 0; i < n; i++) addFig(P, x + (rng() - .5) * S * 17, y + (rng() - .5) * S * 13, z + (rng() - .5) * S * 17);
      }
      const gd = new THREE.Mesh(new THREE.CircleGeometry(S * 120, 44), gM);
      gd.rotation.x = -Math.PI / 2;
      G.add(gd);
      for (let i = 0; i < 9; i++) {
        const a = rng() * Math.PI * 2, len = S * (75 + rng() * 165);
        const pts = [];
        for (let j = 0; j <= 10; j++) {
          const t = j / 10;
          pts.push(new THREE.Vector3(
            Math.cos(a + t * .18 * (rng() - .5)) * (S * 60 + t * len),
            -t * S * 5,
            Math.sin(a + t * .18 * (rng() - .5)) * (S * 60 + t * len)
          ));
        }
        const sr = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 8, S * (2.8 + rng() * 4), 5, false),
          new THREE.MeshLambertMaterial({ map: rT, color: 0x5c3a18 })
        );
        G.add(sr);
      }
      for (let i = 0; i < 12; i++) {
        const a = rng() * Math.PI * 2, r = S * (30 + rng() * 200);
        const ff = new THREE.Mesh(new THREE.SphereGeometry(S * (3 + rng() * 2), 5, 4), fMs[3 + Math.floor(rng() * 2)]);
        ff.position.set(Math.cos(a) * r, S * 2, Math.sin(a) * r);
        ff.scale.y = .55;
        G.add(ff);
      }
      const SP = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(S * 22, S * 115, S * 10),
        new THREE.Vector3(S * 48, S * 248, S * 6),
        new THREE.Vector3(S * 60, S * 392, -S * 14),
        new THREE.Vector3(S * 40, S * 525, -S * 30),
        new THREE.Vector3(S * 14, S * 660, -S * 10),
        new THREE.Vector3(0, S * 780, 0),
      ];
      const tC = new THREE.CatmullRomCurve3(SP);
      function bldTk() {
        const LO = 34, CI = 12, vA = [], uA = [], iA = [];
        for (let i = 0; i <= LO; i++) {
          const t = i / LO, pt = tC.getPoint(t), tg = tC.getTangent(t).normalize();
          const up = new THREE.Vector3(0, 1, 0);
          const ri = new THREE.Vector3().crossVectors(up, tg).normalize();
          if (ri.lengthSq() < .001) ri.set(1, 0, 0);
          const fw = new THREE.Vector3().crossVectors(tg, ri).normalize();
          const bR = S * THREE.MathUtils.lerp(112, 22, t);
          for (let j = 0; j <= CI; j++) {
            const ang = (j / CI) * Math.PI * 2;
            const nv = fbm(Math.cos(ang) * 1.8 + t * 5, Math.sin(ang) * 1.8 + t * 3, 3) * .21;
            const kn = Math.sin(ang * 3 + t * 7) * .05;
            const as = .10 * Math.sin(ang + .8) + .05 * Math.cos(ang * 2 + 1.2);
            const r = bR * (1 + nv + kn + as);
            vA.push(
              pt.x + ri.x * Math.cos(ang) * r + fw.x * Math.sin(ang) * r,
              pt.y + ri.y * Math.cos(ang) * r + fw.y * Math.sin(ang) * r,
              pt.z + ri.z * Math.cos(ang) * r + fw.z * Math.sin(ang) * r
            );
            uA.push(j / CI, t * 4);
          }
        }
        for (let i = 0; i < LO; i++) for (let j = 0; j < CI; j++) {
          const a = i * (CI + 1) + j, b = a + 1, c = a + (CI + 1), d = c + 1;
          iA.push(a, c, b, b, c, d);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vA, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uA, 2));
        geo.setIndex(iA);
        geo.computeVertexNormals();
        return geo;
      }
      G.add(new THREE.Mesh(bldTk(), bM));
      for (let i = 0; i < 5; i++) {
        const t = .1 + rng() * .7, pt = tC.getPoint(t), a = rng() * Math.PI * 2;
        const bR = S * THREE.MathUtils.lerp(112, 22, t), kr = S * (12 + rng() * 14);
        const kg = new THREE.SphereGeometry(kr, 6, 5);
        kg.scale(1, .6, 1);
        const km = new THREE.Mesh(kg, new THREE.MeshLambertMaterial({ map: bT, color: 0x6a3e1a }));
        km.position.set(pt.x + Math.cos(a) * (bR + kr * .5), pt.y, pt.z + Math.sin(a) * (bR + kr * .5));
        G.add(km);
      }
      for (let i = 0; i < 8; i++) {
        const a = rng() * Math.PI * 2, bH = S * (140 + rng() * 190);
        const sp = S * (95 + rng() * 105), th = S * (8 + rng() * 10);
        const pts = [];
        for (let j = 0; j <= 14; j++) {
          const t = j / 14, co = Math.pow(1 - t, 1.8) * sp;
          const w = Math.sin(t * Math.PI * 2 + i) * (rng() * .18);
          pts.push(new THREE.Vector3(Math.cos(a + w * .1) * (S * 75 + co), t * bH + Math.sin(t * Math.PI) * S * 28, Math.sin(a + w * .1) * (S * 75 + co)));
        }
        const bm = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 12, th, 7, false),
          new THREE.MeshLambertMaterial({ map: bT, color: new THREE.Color(.27 + rng() * .07, .14 + rng() * .04, .05 + rng() * .03) })
        );
        G.add(bm);
      }
      const bEPs = [];
      function addBr(sx, sy, sz, ex, ey, ez, r, layer) {
        const m1x = THREE.MathUtils.lerp(sx, ex, .33) + (rng() - .5) * S * 32;
        const m1y = THREE.MathUtils.lerp(sy, ey, .33) - S * 22 * layer + (rng() - .5) * S * 14;
        const m1z = THREE.MathUtils.lerp(sz, ez, .33) + (rng() - .5) * S * 32;
        const m2x = THREE.MathUtils.lerp(sx, ex, .67) + (rng() - .5) * S * 26;
        const m2y = THREE.MathUtils.lerp(sy, ey, .67) - S * 36 * layer + (rng() - .5) * S * 10;
        const m2z = THREE.MathUtils.lerp(sz, ez, .67) + (rng() - .5) * S * 26;
        const cv = new THREE.CatmullRomCurve3([
          new THREE.Vector3(sx, sy, sz), new THREE.Vector3(m1x, m1y, m1z),
          new THREE.Vector3(m2x, m2y, m2z), new THREE.Vector3(ex, ey, ez)
        ]);
        const br = layer === 0 ? .82 : layer === 1 ? .72 : .60;
        const mesh = new THREE.Mesh(
          new THREE.TubeGeometry(cv, layer < 2 ? 9 : 6, r, 6, false),
          new THREE.MeshLambertMaterial({ map: bT, color: new THREE.Color(br, br * .82, br * .65) })
        );
        G.add(mesh);
        bEPs.push({ pos: new THREE.Vector3(ex, ey, ez), layer });
      }
      const tp = tC.getPoint(1), mp = tC.getPoint(.55);
      addBr(tp.x, tp.y, tp.z, tp.x - S * 265, tp.y + S * 172, tp.z - S * 132, S * 21, 0);
      addBr(tp.x, tp.y, tp.z, tp.x + S * 275, tp.y + S * 190, tp.z + S * 112, S * 21, 0);
      addBr(tp.x, tp.y, tp.z, tp.x + S * 95, tp.y + S * 210, tp.z - S * 265, S * 19, 0);
      addBr(tp.x, tp.y, tp.z, tp.x - S * 130, tp.y + S * 202, tp.z + S * 260, S * 18, 0);
      addBr(tp.x, tp.y, tp.z, tp.x + S * 30, tp.y + S * 238, tp.z + S * 35, S * 17, 0);
      addBr(mp.x, mp.y, mp.z, mp.x - S * 210, mp.y + S * 190, mp.z + S * 155, S * 15, 0);
      addBr(mp.x, mp.y, mp.z, mp.x + S * 225, mp.y + S * 172, mp.z - S * 115, S * 14, 0);
      const pS = bEPs.slice();
      pS.forEach(ep => {
        const n = 2 + Math.floor(rng() * 2);
        for (let k = 0; k < n; k++) {
          const sp = S * (148 + rng() * 138), ax = rng() * Math.PI * 2;
          addBr(ep.pos.x, ep.pos.y, ep.pos.z, ep.pos.x + Math.cos(ax) * sp, ep.pos.y + S * (102 + rng() * 115), ep.pos.z + Math.sin(ax) * sp, S * (8 + rng() * 5), 1);
        }
      });
      bEPs.filter(e => e.layer === 1).forEach(ep => {
        if (rng() < .75) {
          const sp = S * (92 + rng() * 105), ax = rng() * Math.PI * 2;
          addBr(ep.pos.x, ep.pos.y, ep.pos.z, ep.pos.x + Math.cos(ax) * sp, ep.pos.y + S * (85 + rng() * 88), ep.pos.z + Math.sin(ax) * sp, S * (4.5 + rng() * 3), 2);
        }
      });
      function lGeo(lw, ll) {
        const sh = new THREE.Shape(), n = 12;
        sh.moveTo(-ll * .5, 0);
        for (let i = 1; i <= n; i++) {
          const t = i / n, x = (t - .5) * ll;
          const w = Math.pow(Math.sin(t * Math.PI), .75) * lw * .5;
          const cm = Math.sin(t * Math.PI) * .07 * ll;
          sh.lineTo(x, w + cm);
        }
        for (let i = n - 1; i >= 0; i--) {
          const t = i / n, x = (t - .5) * ll;
          const w = Math.pow(Math.sin(t * Math.PI), .75) * lw * .5;
          const cm = Math.sin(t * Math.PI) * .07 * ll;
          sh.lineTo(x, -w + cm);
        }
        sh.closePath();
        return new THREE.ShapeGeometry(sh, 3);
      }
      function spL(cx, cy, cz, rad, cnt) {
        for (let i = 0; i < cnt; i++) {
          const lw = S * (22 + rng() * 18), ll = S * (45 + rng() * 49);
          const lf = new THREE.Mesh(lGeo(lw, ll), lMs[i % lMs.length]);
          const th = rng() * Math.PI * 2, ph = (rng() - .5) * Math.PI * .75;
          const r = rng() * rad;
          lf.position.set(cx + r * Math.cos(th) * Math.cos(ph), cy + r * Math.abs(Math.sin(ph)) * .5 + rng() * S * 20, cz + r * Math.sin(th) * Math.cos(ph));
          lf.rotation.set((rng() - .5) * 1.3 + .15, rng() * Math.PI * 2, (rng() - .5) * 1.2);
          G.add(lf);
        }
      }
      bEPs.forEach(ep => {
        if (ep.layer === 2) spL(ep.pos.x, ep.pos.y, ep.pos.z, S * 112, 15);
        else if (ep.layer === 1) spL(ep.pos.x, ep.pos.y, ep.pos.z, S * 68, 6);
        else spL(ep.pos.x, ep.pos.y, ep.pos.z, S * 40, 3);
      });
      for (let i = 0; i < 16; i++) {
        const ep = bEPs[Math.floor(rng() * bEPs.length)];
        spL(ep.pos.x + (rng() - .5) * S * 148, ep.pos.y + rng() * S * 110, ep.pos.z + (rng() - .5) * S * 148, S * 132, 11);
      }
      const figG = new THREE.Group();
      G.add(figG);
      figG.visible = false;
      for (let i = 0; i < 72; i++) {
        const t = .08 + rng() * .85, ang = rng() * Math.PI * 2;
        const pt = tC.getPoint(t), tg = tC.getTangent(t).normalize();
        const ri = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tg).normalize();
        if (ri.lengthSq() < .001) ri.set(1, 0, 0);
        const fw = new THREE.Vector3().crossVectors(tg, ri).normalize();
        const bR = S * THREE.MathUtils.lerp(112, 22, t) * 1.04;
        const ox = pt.x + ri.x * Math.cos(ang) * bR + fw.x * Math.sin(ang) * bR;
        const oy = pt.y;
        const oz = pt.z + ri.z * Math.cos(ang) * bR + fw.z * Math.sin(ang) * bR;
        const rG = rng() > .36, mxL = pt.y;
        const len = rG ? mxL : mxL * (.26 + rng() * .54);
        const swX = (rng() - .5) * S * 65, swZ = (rng() - .5) * S * 65, tw = (rng() - .5) * S * 20;
        const nSg = 20, pts = [];
        for (let j = 0; j <= nSg; j++) {
          const tR = j / nSg;
          const bow = Math.sin(tR * Math.PI) * .7, d = tR * tR * .24;
          const wb = Math.sin(tR * Math.PI * 1.8 + i) * S * 5;
          pts.push(new THREE.Vector3(ox + (bow + d) * swX + wb * .35, oy - tR * len, oz + (bow + d) * swZ + wb * .28 + tw * tR));
        }
        const crv = new THREE.CatmullRomCurve3(pts);
        const rTh = rG ? (S * (1.9 + rng() * 2.1)) : (S * (1.3 + rng() * 1.3));
        const rm = new THREE.Mesh(
          new THREE.TubeGeometry(crv, 20, rTh, 5, false),
          new THREE.MeshLambertMaterial({ map: rT, color: new THREE.Color(.24 + rng() * .08, .13 + rng() * .05, .04 + rng() * .03) })
        );
        G.add(rm);
        const nFP = Math.floor(2 + len / S * .0065);
        for (let j = 0; j < nFP; j++) {
          if (rng() < .77) {
            const fp = crv.getPoint(.06 + rng() * .88);
            const fa = rng() * Math.PI * 2, fo = S * (3.5 + rng() * 3);
            sFig(figG, fp.x + Math.cos(fa) * fo, fp.y, fp.z + Math.sin(fa) * fo, 2 + Math.floor(rng() * 3));
          }
        }
      }
      for (let i = 0; i < 9; i++) {
        const t = .05 + rng() * .88, a = rng() * Math.PI * 2;
        const pt = tC.getPoint(t), tg = tC.getTangent(t).normalize();
        const ri = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tg).normalize();
        if (ri.lengthSq() < .001) ri.set(1, 0, 0);
        const fw = new THREE.Vector3().crossVectors(tg, ri).normalize();
        const bR = S * THREE.MathUtils.lerp(112, 22, t) * 1.07;
        sFig(figG, pt.x + ri.x * Math.cos(a) * bR + fw.x * Math.sin(a) * bR, pt.y, pt.z + ri.z * Math.cos(a) * bR + fw.z * Math.sin(a) * bR, 3 + Math.floor(rng() * 3));
      }
      G.userData.figGroup = figG;
      G.userData.leafMats = lMs;
      return G;
    }

    // ─── STATE ───────────────────────────────────────
    let _scene, _camera, _renderer;
    let _treeRoot, _markerRoot, _arContext;
    let _scaleFactor = 1;
    let _extraRotY = 0;
    let _fruit = false;
    let _markerFound = false;
    let _lastMarkerState = false;

    // ─── DEBUG ───────────────────────────────────────
    let _debugOn = false;
    function updateDebug(html) {
      const el = $('debug');
      if (!el) return;
      el.innerHTML = html;
    }
    function setDetectBadge(found) {
      const el = $('detect-badge');
      if (!el) return;
      if (found) {
        el.textContent = '✅ Marker terdeteksi!';
        el.classList.add('found');
      } else {
        el.textContent = '🔍 Mencari marker...';
        el.classList.remove('found');
      }
    }

    // ─── SETUP AR ────────────────────────────────────
    function setupAR() {
      setMsg('Menyiapkan scene...');

      // Scene + Camera
      _scene = new THREE.Scene();
      _camera = new THREE.Camera();
      _scene.add(_camera);

      // Lighting
      _scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const sun = new THREE.DirectionalLight(0xfff5d8, 2.0);
      sun.position.set(1, 3, 2);
      _scene.add(sun);
      _scene.add(new THREE.HemisphereLight(0x88aa88, 0x221100, 0.6));

      // Renderer
      _renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        premultipliedAlpha: false
      });
      _renderer.setClearColor(0x000000, 0);
      _renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      _renderer.setSize(window.innerWidth, window.innerHeight);
      _renderer.domElement.style.cssText =
        'position:fixed !important;top:0 !important;left:0 !important;' +
        'width:100vw !important;height:100vh !important;' +
        'z-index:2 !important;pointer-events:none !important;' +
        'background:transparent !important;';
      document.body.appendChild(_renderer.domElement);

      setMsg('Meminta akses kamera...');

      // AR.js source
      const arToolkitSource = new THREEx.ArToolkitSource({
        sourceType: 'webcam',
        sourceWidth: 1280,
        sourceHeight: 720,
        displayWidth: window.innerWidth,
        displayHeight: window.innerHeight
      });

      arToolkitSource.init(function onReady() {
        const video = arToolkitSource.domElement;
        if (video) {
          video.removeAttribute('style');
          video.style.cssText =
            'position:fixed !important;top:0 !important;left:0 !important;' +
            'right:0 !important;bottom:0 !important;' +
            'width:100vw !important;height:100vh !important;' +
            'min-width:100vw !important;min-height:100vh !important;' +
            'max-width:none !important;max-height:none !important;' +
            'object-fit:cover !important;z-index:1 !important;' +
            'display:block !important;visibility:visible !important;' +
            'opacity:1 !important;transform:none !important;' +
            'background:#000 !important;';
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.muted = true;
          video.playsInline = true;
          if (video.paused) video.play().catch(() => {});
        }

        console.log('=== VIDEO SETUP ===');
        if (video) {
          console.log('Video dimensions:', video.videoWidth, 'x', video.videoHeight);
          console.log('Video readyState:', video.readyState);
        }

        // Tunggu video siap
        let attempts = 0;
        function checkReady() {
          attempts++;
          if (video && (video.readyState >= 2 && video.videoWidth > 0) || attempts > 30) {
            setMsg('Kamera aktif!');
            setTimeout(() => {
              const load = $('scr-load');
              if (load) load.classList.add('hide');
              const hud = $('hud');
              if (hud) hud.classList.add('show');
            }, 300);
          } else {
            setMsg('Menunggu video... (' + attempts + ')');
            setTimeout(checkReady, 150);
          }
        }
        checkReady();

        setTimeout(onResize, 200);
      }, function onError(err) {
        console.error('AR.js source error:', err);
        showErr(
          'Kamera tidak dapat diakses',
          'Izinkan akses kamera di browser. Detail: ' + (err && err.message ? err.message : String(err))
        );
      });

      function onResize() {
        try {
          arToolkitSource.onResizeElement();
          arToolkitSource.copyElementSizeTo(_renderer.domElement);
          if (_arContext && _arContext.arController !== null) {
            arToolkitSource.copyElementSizeTo(_arContext.arController.canvas);
          }
        } catch (e) { /* ignore */ }
      }
      window.addEventListener('resize', onResize);

      // AR context
      _arContext = new THREEx.ArToolkitContext({
        cameraParametersUrl: 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/data/camera_para.dat',
        detectionMode: 'mono',
        maxDetectionRate: 60,
        canvasWidth: 640,
        canvasHeight: 480
      });

      _arContext.init(function onCompleted() {
        _camera.projectionMatrix.copy(_arContext.getProjectionMatrix());
      });

      // Marker root
      _markerRoot = new THREE.Group();
      _scene.add(_markerRoot);

      // ─── KUNCI: ukuran marker & marker pattern dengan smoothing ───
      new THREEx.ArMarkerControls(_arContext, _markerRoot, {
        type: 'pattern',
        patternUrl: 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/data/patt.hiro',
        size: MARKER_SIZE_METERS,
        // Opsi smoothing untuk deteksi lebih stabil
        smooth: true,
        smoothCount: 10,
        smoothTolerance: 0.01,
        smoothThreshold: 3
      });

      // Build tree & attach
      setMsg('Membangun pohon...');
      const bT = mkBark(), gT = mkGnd(), fT = mkFig(), rT = mkRoot();
      _treeRoot = buildTree(bT, gT, fT, rT);
      _treeRoot.scale.setScalar(TREE_SCALE);
      _treeRoot.rotation.y = Math.PI;
      _markerRoot.add(_treeRoot);

      // Marker tidak terlihat sampai terdeteksi
      _markerRoot.visible = false;

      // Animasi loop
      let _t = 0;
      let _frameCount = 0;

      function animate() {
        requestAnimationFrame(animate);
        _t += 0.01;
        _frameCount++;

        if (arToolkitSource.ready !== false) {
          try { _arContext.update(arToolkitSource.domElement); } catch (e) {}
        }

        // Cek status deteksi marker
        const isVisible = _markerRoot.visible;
        if (isVisible !== _lastMarkerState) {
          _lastMarkerState = isVisible;
          setDetectBadge(isVisible);
          if (isVisible) {
            console.log('✅ Marker terdeteksi!');
            hint('Pohon muncul! Mundur sedikit untuk melihat utuh');
          } else {
            console.log('❌ Marker hilang');
            hint('Arahkan kamera TEGAK LURUS ke marker');
          }
        }

        // Update debug panel
        if (_debugOn && _frameCount % 15 === 0) {
          const video = document.querySelector('video');
          const pos = _markerRoot.position;
          updateDebug(
            '<b>DEBUG</b><br>' +
            'Video: ' + (video ? video.videoWidth + 'x' + video.videoHeight : '-') + '<br>' +
            'Ready: ' + (video ? video.readyState : '-') + '<br>' +
            'Marker: ' + (isVisible ? '✅ FOUND' : '❌ no') + '<br>' +
            'Pos: ' + pos.x.toFixed(2) + ',' + pos.y.toFixed(2) + ',' + pos.z.toFixed(2) + '<br>' +
            'RotY: ' + (_extraRotY * 180 / Math.PI).toFixed(0) + '°'
          );
        }

        if (_treeRoot && isVisible) {
          _treeRoot.traverse(o => {
            if (o.isMesh && o.material && o.material.side === THREE.DoubleSide) {
              if (!o._baseRot) o._baseRot = { x: o.rotation.x, z: o.rotation.z };
              o.rotation.x = o._baseRot.x + Math.sin(_t * 0.6 + o.id) * 0.03;
              o.rotation.z = o._baseRot.z + Math.cos(_t * 0.5 + o.id) * 0.025;
            }
          });
        }
        _renderer.render(_scene, _camera);
      }
      animate();
    }

    function showErr(title, msg) {
      const load = $('scr-load');
      if (load) load.classList.add('hide');
      const err = $('scr-err');
      if (err) {
        err.classList.add('show');
        $('err-title').textContent = title;
        $('err-msg').textContent = msg;
      }
    }

    // ─── KONTROL ─────────────────────────────────────
    function bindControls() {
      $('c-sm').onclick = () => {
        _scaleFactor = Math.max(0.3, _scaleFactor * 0.78);
        if (_treeRoot) _treeRoot.scale.setScalar(TREE_SCALE * _scaleFactor);
        toast('Skala: ' + Math.round(_scaleFactor * 100) + '%');
      };
      $('c-lg').onclick = () => {
        _scaleFactor = Math.min(4, _scaleFactor * 1.28);
        if (_treeRoot) _treeRoot.scale.setScalar(TREE_SCALE * _scaleFactor);
        toast('Skala: ' + Math.round(_scaleFactor * 100) + '%');
      };
      $('c-rt').onclick = () => {
        _extraRotY += Math.PI / 4;
        if (_treeRoot) _treeRoot.rotation.y = Math.PI + _extraRotY;
        toast('Putar 45°');
      };
      $('c-fr').onclick = function() {
        _fruit = !_fruit;
        this.classList.toggle('on', _fruit);
        if (!_treeRoot) return;
        const fg = _treeRoot.userData.figGroup;
        if (fg) fg.visible = _fruit;
        const lm = _treeRoot.userData.leafMats;
        if (lm) {
          const h = _fruit ? .27 : .265;
          const s = _fruit ? .58 : .55;
          const l = _fruit ? .15 : .18;
          lm.forEach((m, i) => m.color.setHSL(h + i * .013, s, l + (i % 3) * .03));
        }
        toast(_fruit ? '🌰 Mode Berbuah' : '🌿 Mode Normal');
      };
      $('c-dbg').onclick = function() {
        _debugOn = !_debugOn;
        this.classList.toggle('on', _debugOn);
        const el = $('debug');
        if (el) el.classList.toggle('show', _debugOn);
      };
      $('btn-exit').onclick = () => location.reload();
    }

    // ─── START ───────────────────────────────────────
    window.addEventListener('load', () => {
      if (typeof THREEx === 'undefined' || !THREEx.ArToolkitSource) {
        showErr('AR.js gagal dimuat', 'Library AR.js tidak dapat dimuat. Periksa koneksi internet.');
        return;
      }
      try {
        setupAR();
        bindControls();
      } catch (e) {
        console.error(e);
        showErr('Gagal memulai AR', e.message || 'Kesalahan tidak dikenal.');
      }
    });

  })();
  </script>
</body>
</html>
